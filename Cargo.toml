[package]
name = "gotodo"
version = "0.0.2"
edition = "2024"
description = "A calm, encrypted, keyboard-first to-do manager for Linux"
repository = "https://github.com/nurkert/gotodo"

[dependencies]
iced = { version = "0.14", features = ["tokio", "canvas", "advanced", "svg"] }
tokio = { version = "1", features = ["rt", "net", "io-util", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
argon2 = "0.5"
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
zeroize = { version = "1", features = ["derive"] }
getrandom = "0.3"
base64 = "0.22"
directories = "6"
libc = "0.2"
secret-service = { version = "5", features = ["rt-tokio-crypto-rust"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[dev-dependencies]
tempfile = "3"
iced_test = "0.14"

[package.metadata.deb]
maintainer = "nurkert <kreativ@burkert-gestaltung.com>"
copyright = "2026, nurkert"
section = "utils"
priority = "optional"
extended-description = """\
gotodo is a keyboard-first to-do manager for Linux. Your library is stored only \
on this device, encrypted, and opens with a password or an unlocked KeePassXC."""
depends = "$auto, libxkbcommon0, libwayland-client0, libwayland-egl1, libegl1"
recommends = "keepassxc, mesa-vulkan-drivers, libvulkan1, libx11-6, libxcursor1, libxi6, libxkbcommon-x11-0"
assets = [
    ["target/release/gotodo", "usr/bin/", "755"],
    ["packaging/gotodo.desktop", "usr/share/applications/", "644"],
    ["packaging/gotodo.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["assets/fonts/OFL.txt", "usr/share/doc/gotodo/fonts-OFL.txt", "644"],
    ["README.md", "usr/share/doc/gotodo/", "644"],
]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
